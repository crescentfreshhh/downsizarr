services:
  downsizarr:
    build: .
    # Or use a prebuilt image once published:
    # image: ghcr.io/crescentfreshhh/downsizarr:latest
    container_name: downsizarr
    ports:
      - "8080:8080"
    environment:
      - DOWNSIZARR_MEDIA_ROOT=/media
      - DOWNSIZARR_DATA_DIR=/config
      - DOWNSIZARR_OUTPUT_SUFFIX=.hevc
      - DOWNSIZARR_MAX_CONCURRENT=1
      - DOWNSIZARR_DEFAULT_ENCODER=libx265
      - DOWNSIZARR_DEFAULT_CRF=18
      - DOWNSIZARR_DEFAULT_PRESET=slow
      # Match these to your Unraid user so output files get sane ownership:
      - PUID=99
      - PGID=100
    volumes:
      # Point this at your Unraid media share. Use the SAME path your other
      # apps use so paths line up. Read/write is required (output is written
      # next to the source).
      - /mnt/user/media:/media
      # Persists the metrics DB + logs across restarts.
      - ./config:/config
    # --- Hardware encoding (Intel QSV / VAAPI) ---
    # Uncomment to pass the iGPU through for hevc_qsv / hevc_vaapi:
    # devices:
    #   - /dev/dri:/dev/dri
    # --- Hardware encoding (NVIDIA NVENC) ---
    # Requires nvidia-container-toolkit on the host and an nvenc-capable ffmpeg
    # build. Uncomment and run with the nvidia runtime:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    restart: unless-stopped
