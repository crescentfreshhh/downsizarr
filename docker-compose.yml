services:
  downsizarr:
    build: .
    # Or use a prebuilt image once published:
    # image: ghcr.io/crescentfreshhh/downsizarr:latest
    container_name: downsizarr
    ports:
      - "8080:8080"
    environment:
      - DOWNSIZARR_MEDIA_ROOT=/media
      - DOWNSIZARR_DATA_DIR=/config
      - DOWNSIZARR_OUTPUT_SUFFIX=.hevc
      - DOWNSIZARR_MAX_CONCURRENT=1
      # GPU-first defaults (NVIDIA NVENC + full CUDA pipeline):
      - DOWNSIZARR_DEFAULT_ENCODER=hevc_nvenc
      - DOWNSIZARR_DEFAULT_CRF=18
      - DOWNSIZARR_DEFAULT_PRESET=p7
      - DOWNSIZARR_DEFAULT_GPU_DECODE=true
      # Match these to your Unraid user so output files get sane ownership:
      - PUID=99
      - PGID=100
      # --- NVIDIA GPU access ---
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # NVIDIA runtime (requires nvidia-container-toolkit on the host). The
    # bundled ffmpeg already includes nvenc + CUDA.
    runtime: nvidia
    volumes:
      # Point this at your Unraid media share. Use the SAME path your other
      # apps use so paths line up. Read/write is required (output is written
      # next to the source).
      - /mnt/user/media:/media
      # Persists the metrics DB + logs across restarts.
      - ./config:/config
    # --- Intel QSV / VAAPI instead of NVIDIA? ---
    # Remove the `runtime: nvidia` line and the NVIDIA_* env vars above, set
    # DOWNSIZARR_DEFAULT_ENCODER=hevc_qsv (or hevc_vaapi), and pass the iGPU:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
